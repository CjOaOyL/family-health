<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self' https://cdnjs.cloudflare.com https://accounts.google.com; worker-src blob: https://cdnjs.cloudflare.com; style-src 'self'; img-src 'self' data: blob:; connect-src https://www.googleapis.com https://oauth2.googleapis.com; frame-src https://accounts.google.com; font-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Family Health</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232a78d6'/%3E%3Cpath d='M9 17h4l2-5 3 9 2-4h3' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./app/styles.css">
</head>
<body>
  <a class="skip" href="#app">Skip to content</a>
  <header id="topbar" class="topbar"></header>
  <main id="app" class="container" aria-live="polite">
    <p class="muted">Loading…</p>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p class="container">This app needs JavaScript. Nothing is sent anywhere; all processing happens in your browser.</p></noscript>

  <!-- app/boot.js loads pdf.js 4.10.38 from cdnjs (module + worker, pinned) and starts the app.
       The CSP above forbids inline scripts and every origin except: cdnjs (pdf.js), accounts.google.com
       (Google sign-in, loaded only when the user connects Drive) and www.googleapis.com / oauth2.googleapis.com
       (Drive API, used only after sign-in to read/write this app's hidden folder in the user's own Drive). -->
  <script type="module" src="./app/boot.js"></script>
</body>
</html>
